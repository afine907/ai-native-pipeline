name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Generate changelog
        run: |
          echo "## Changes in ${{ steps.version.outputs.version }}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Agents" >> CHANGELOG.md
          echo "- impact-analyzer: Enhanced with multi-language support" >> CHANGELOG.md
          echo "- prd-agent: Added scenario adaptation" >> CHANGELOG.md
          echo "- spec-agent: Added architecture patterns" >> CHANGELOG.md
          echo "- coding-agent: Added project type adaptation" >> CHANGELOG.md
          echo "- verification-agent: Added verification types" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Tools" >> CHANGELOG.md
          echo "- Added evaluation framework" >> CHANGELOG.md
          echo "- Added LLM-as-Judge evaluation" >> CHANGELOG.md
          echo "- Added AgentOps design docs" >> CHANGELOG.md
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            agents/
            skills/
            rules/
            scripts/
            docs/
            README.md
            CHANGELOG.md

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Create release summary
        run: |
          echo "✅ Release ${{ github.ref_name }} published"
          echo ""
          echo "📦 Artifacts uploaded"
          echo "📝 CHANGELOG.md generated"
