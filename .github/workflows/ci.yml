name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  LONGCAT_API_KEY: ${{ secrets.LONGCAT_API_KEY }}

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install ruff
      
      - name: Run Ruff (warning only)
        run: |
          ruff check scripts/ --ignore E501,F401 || true
          echo "✅ Lint check completed"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pytest requests
      
      - name: Generate test tasks
        run: |
          python scripts/evaluate_interactive.py --generate-tasks
      
      - name: Verify scripts syntax
        run: |
          python -m py_compile scripts/evaluate_interactive.py
          python -m py_compile scripts/evaluate_llm_judge.py
          python -m py_compile scripts/run_agent_auto.py
          python -m py_compile scripts/evaluate_real.py
          echo "✅ All scripts syntax OK"

  plugin-test:
    name: Claude Code Plugin Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check plugin structure
        run: |
          # 验证插件目录结构
          test -f .claude-plugin/plugin.json && echo "✅ plugin.json exists"
          test -d agents && echo "✅ agents/ exists"
          test -d skills && echo "✅ skills/ exists"
          test -d rules && echo "✅ rules/ exists"
          
          # 验证 plugin.json 格式
          cat .claude-plugin/plugin.json | python -m json.tool > /dev/null && echo "✅ plugin.json is valid JSON"
          
          # 验证必需文件
          for agent in impact-analyzer prd-agent spec-agent coding-agent verification-agent; do
            test -f agents/${agent}.md && echo "✅ ${agent}.md exists"
          done
          
          for skill in pipeline task-breakdown code-review test-generator; do
            test -f skills/${skill}/SKILL.md && echo "✅ ${skill}/SKILL.md exists"
          done

  agent-evaluation:
    name: Agent Evaluation
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'needs-evaluation'))
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Create test project
        run: |
          mkdir -p /tmp/test-project/src/{auth,api/routes,models}
          mkdir -p /tmp/test-project/tests/auth
          
          cat > /tmp/test-project/src/auth/session.py << 'EOF'
          class SessionManager:
              def create(self, user_id: int) -> str:
                  return f"session_{user_id}"
              def verify(self, token: str) -> dict:
                  return {"user_id": int(token.split("_")[1])}
          EOF
          
          cat > /tmp/test-project/src/auth/middleware.py << 'EOF'
          from auth.session import SessionManager
          session_manager = SessionManager()
          def authenticate(token: str) -> dict:
              return session_manager.verify(token)
          EOF
          
          cat > /tmp/test-project/src/models/user.py << 'EOF'
          from dataclasses import dataclass
          @dataclass
          class User:
              id: int
              username: str
              email: str
          EOF
      
      - name: Run impact-analyzer evaluation
        id: evaluate
        run: |
          if [ -n "$LONGCAT_API_KEY" ]; then
            echo "Running real evaluation..."
            
            # Generate tasks
            python scripts/evaluate_interactive.py --generate-tasks
            
            # Run agent
            python scripts/evaluate_real.py \
              --agent impact-analyzer \
              --api-key "$LONGCAT_API_KEY"
            
            # Run LLM judge
            python scripts/evaluate_llm_judge.py \
              --agent impact-analyzer \
              --api-key "$LONGCAT_API_KEY"
            
            # Extract score
            REPORT=$(ls -t .harness/eval/reports/*.json | head -1)
            if [ -f "$REPORT" ]; then
              AVG_SCORE=$(jq -r '.summary.avg_score' "$REPORT")
              echo "avg_score=$AVG_SCORE" >> $GITHUB_OUTPUT
              echo "📊 Average Score: $AVG_SCORE/5"
            fi
          else
            echo "⚠️ LONGCAT_API_KEY not set, skipping evaluation"
            echo "avg_score=0" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload results
        if: steps.evaluate.outputs.avg_score != '0'
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: |
            .harness/eval/outputs/
            .harness/eval/reports/
          retention-days: 7
      
      - name: Check quality gate
        if: steps.evaluate.outputs.avg_score != '0'
        run: |
          SCORE=${{ steps.evaluate.outputs.avg_score }}
          echo "Score: $SCORE/5"
          
          # 质量门禁：分数 < 3.5 则失败
          if (( $(echo "$SCORE < 3.5" | bc -l) )); then
            echo "❌ Quality gate failed: score $SCORE < 3.5"
            exit 1
          else
            echo "✅ Quality gate passed: score $SCORE >= 3.5"
          fi
